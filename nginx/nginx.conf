# ------------------------------------------------------------
# HIGH PERFORMANCE TUNING - CONVENIAT NGINX REVERSE PROXY
# ------------------------------------------------------------
user  nginx;
worker_processes  auto;  # Automatically use all available CPU cores

# Increase the limit of open files (descriptors) per worker
worker_rlimit_nofile 8192;

events {
    # 4096 is safer for 200+ concurrent users
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 50M;

    # IMAGE OPTIMIZATION CACHE SPLITTING
    map $http_accept $image_format {
        default     "";
        "~*avif"    "-avif";
        "~*webp"    "-webp";
    }

    # =========================================================
    # RACE CONDITION & CACHE POISONING PROTECTION
    # =========================================================
    # 1. Detect if the upstream returned an HTML page (e.g. loading screen)
    map $upstream_http_content_type $is_html {
        default       0;
        "~*text/html" 1;
    }

    # 2. Dynamically set Cache-Control based on the content type
    map $upstream_http_content_type $static_cache_control {
        default       "public, max-age=31536000, immutable";
        "~*text/html" "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 1. Resolver (Docker Swarm internal DNS)
    resolver 127.0.0.11 ipv6=off valid=10s;

    # 2. Cache Path
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:100m max_size=10g inactive=7d use_temp_path=off;

    # FIXED: Added $http_accept to properly cache Next.js WebP/AVIF content negotiation
    proxy_cache_key "$scheme$request_method$host$uri$is_args$args$image_format";

    # 3. Connection Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Increase buffer sizes to handle large Next.js headers/cookies
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    server {
        listen 80;
        server_name _;

        server_tokens off;
        gzip on;
        gzip_proxied any;
        gzip_comp_level 4;
        gzip_types text/css application/javascript image/svg+xml application/json;

        # FIXED: Resolves to the Docker Swarm service name 'payload'
        set $upstream_target http://payload:3000;

        # ------------------------------------------------------------
        # GLOBAL CACHE SETTINGS
        # ------------------------------------------------------------
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # =========================================================
        # ZONE 1: STATIC CHUNKS (Direct Cumulative Disk + Hard 404 for JS)
        # =========================================================

        # Force real HTTP 404 for missing .js files so browsers never receive 200 OK HTML fallback
        location ~ ^/_next/static/.*\.js$ {
            alias /var/www/next-static/;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location /_next/static/ {
            alias /var/www/next-static/;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";

            # Try serving from cumulative persistent volume disk first;
            # Fall back to Next.js upstream container if not yet on disk
            try_files $uri @nextjs_static;
        }

        location @nextjs_static {
            proxy_pass $upstream_target;
            proxy_cache STATIC;

            # Prevent saving to cache if the upstream returned an HTML page
            proxy_no_cache $is_html;

            # The Nuke
            proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires X-Accel-Buffering;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Vary;
            proxy_hide_header Cache-Control;

            proxy_cache_valid 200 301 302 365d;
            proxy_cache_valid 404 0s; # Never cache 404s for static chunks

            add_header ETag $upstream_http_etag;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control $static_cache_control;

            proxy_intercept_errors on;
            error_page 404 =404 /empty_404;
        }

        # Next.js Image Optimization
        location /_next/image {
            proxy_pass $upstream_target;
            proxy_cache STATIC;

            proxy_no_cache $is_html;

            proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires X-Accel-Buffering;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Vary;
            proxy_hide_header Cache-Control;

            proxy_cache_valid 200 301 302 60m;

            add_header ETag $upstream_http_etag;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control $static_cache_control;
        }

        # Lightweight 404 handler
        location = /empty_404 {
            internal;
            return 404 "";
        }

        # =========================================================
        # ZONE 1.5: SERVICE WORKERS (NEVER CACHE)
        # =========================================================
        location ~* ^/(sw\.js|workbox-.*\.js)$ {
            proxy_pass $upstream_target;
            proxy_cache off;
            proxy_buffering off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # =========================================================
        # ZONE 2: PUBLIC FILES
        # =========================================================
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff|woff2|eot|ttf|otf|mp4|avif|webp)$ {
            proxy_pass $upstream_target;
            proxy_cache STATIC;

            # Prevent saving to cache if the upstream returned an HTML page
            proxy_no_cache $is_html;

            # The Nuke
            proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires X-Accel-Buffering;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Vary;
            proxy_hide_header Cache-Control;

            proxy_cache_valid 200 301 302 60m;

            add_header ETag $upstream_http_etag;
            add_header X-Cache-Status $upstream_cache_status;

            # DYNAMIC FIX: Aggressively cache actual files, but NEVER cache startup HTML fallbacks in browser
            add_header Cache-Control $static_cache_control;

            proxy_intercept_errors on;
            error_page 404 500 502 503 504 =404 /empty_404;
        }

        # =========================================================
        # ZONE 3: DYNAMIC (Respect Headers)
        # =========================================================

        # Intercept Traefik health checks at the edge
        location = /status {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            proxy_pass $upstream_target;
            proxy_cache off;

            # FIXED: Buffering is ON by default. Disabling it completely chokes Node.js on slow clients.
            proxy_buffering on;

            # 1. Ensure upstream can talk chunked
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 2. Prevent Nginx from buffering if it sees these headers
            proxy_ignore_headers X-Accel-Buffering;

            add_header X-Cache-Status $upstream_cache_status;

            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
