# Runs when release-please publishes a release, i.e. when the release pull request on main is
# merged. A plain merge into main builds nothing; see .github/workflows/release-please.yml.
# The first step refuses a release that was not made that way: a hand-published release, a
# pre-release, or a tag on a commit that is not on main would otherwise overwrite the `latest`
# image that production redeploys from.
on:
  release:
    types:
      - published

name: Build Prod Deployment Image

jobs:
  build-production-image:
    runs-on: ubuntu-latest

    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') }}

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔎 Refuse a release whose commit is not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release ${{ github.event.release.tag_name }} points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: registry.cevi.tools
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.cevi.tools/cevi/conveniat27-webpage:latest
            registry.cevi.tools/cevi/conveniat27-webpage:${{ github.event.release.tag_name }}
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=BGXpnSSQfJS84zCk6qka6-3qC_bTK6feOUaLz6ZJY6ThmdcY-h20V0QB8P8nq84Pb6vpbZLvYwISwlSmH9aZwjU
            NEXT_PUBLIC_APP_HOST_URL=https://conveniat27.ch
            NEXT_PUBLIC_POSTHOG_KEY=phc_QXeG5AHoyxCVCcIse8a2rriQKZgAwkk3vO15Zz0aDud
            NEXT_PUBLIC_POSTHOG_HOST=https://eu.i.posthog.com
            NEXT_PUBLIC_HITOBITO_API_URL=https://db.cevi.ch
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
            POSTHOG_PROJECT_ID=${{ secrets.POSTHOG_PROJECT_ID }}
            BUILD_GIT_HASH=${{ github.sha }}
            BUILD_GIT_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha
