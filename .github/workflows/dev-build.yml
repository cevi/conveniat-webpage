on:
  push:
    branches:
      - dev

name: Build Dev Deployment Image

jobs:
  build-dev-image:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # No `version:` — action-setup reads the `packageManager` field in
      # package.json. Pinning a different major here makes every pnpm call in
      # this job fail, which leaves STORE_PATH empty below.
      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 💾 Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: ♻️ Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: ⚡ Setup Next.js cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Next.js app
        run: |
          if [ "${NEXT_PUBLIC_APP_HOST_URL}" != "https://conveniat27.ch" ]; then
            cp public/dev-icons/* public/
          fi
          bash create_build_info.sh
          npx prisma generate --no-hints
          pnpm run build
          mkdir -p .next/standalone/node_modules/@img && cp -r node_modules/@img/* .next/standalone/node_modules/@img/ 2>/dev/null || true
          mkdir -p .next/standalone/node_modules/.pnpm && cp -r node_modules/.pnpm/* .next/standalone/node_modules/.pnpm/ 2>/dev/null || true
          mkdir -p .next/cache/fs-fallback
        env:
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BLXA-pUY_vYom2sNw8BGmZHgJGUJvyNwwJ6ZomTm3Liv0Gs7rGrqlGMEwBobN9pVwb-OhJFAlxy-UwHI3fCQ250
          NEXT_PUBLIC_APP_HOST_URL: https://conveniat27.cevi.tools
          NEXT_PUBLIC_POSTHOG_KEY: phc_QXeG5AHoyxCVCcIse8a2rriQKZgAwkk3vO15Zz0aDud
          NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          PRISMA_OUTPUT: 'src/lib/prisma/client/'

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: registry.cevi.tools
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: registry.cevi.tools/cevi/conveniat27-webpage:dev
          cache-from: type=gha
          cache-to: type=gha
