name: Run Test Suite

# Every pull request, not just those targeting main and dev: a required status check
# that never reports leaves the pull request pending forever, and a stacked branch is
# exactly the case where the suite is most worth having.
on:
  pull_request:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        name: Checkout repository

      - name: Copy environment variables
        run: cp .env.example .env

      - name: Start Docker services
        run: COMPOSE_PROFILES="" docker compose up -d --wait

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate --no-hints

      - name: Generate Build Info
        run: bash create_build_info.sh

      - name: Apply database migrations (Issue #570)
        env:
          CHAT_DATABASE_URL: postgres://user:myTopSecretPassword@localhost:5432/conveniat27
        run: pnpm exec prisma migrate deploy

      - name: Check database migrations status (Issue #570)
        env:
          CHAT_DATABASE_URL: postgres://user:myTopSecretPassword@localhost:5432/conveniat27
        run: pnpm exec prisma migrate status

      - name: Run tests
        run: pnpm test
