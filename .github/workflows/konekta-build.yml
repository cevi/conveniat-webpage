# Runs when release-please publishes a release, i.e. when the release pull request on main is
# merged. A plain merge into main builds nothing; see .github/workflows/release-please.yml.
on:
  release:
    types:
      - published

name: Build Konekta Deployment Image
jobs:
  call-konekta-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Workflow in Konekta Repository
        uses: peter-evans/repository-dispatch@v4
        with:
          repository: cevi/konekta-webpage
          event-type: build-konekta-deployment-image
          token: ${{ secrets.KONEKTA_TOKEN }}
