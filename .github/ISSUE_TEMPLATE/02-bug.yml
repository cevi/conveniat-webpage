name: Bug Report
description: File a bug report.
title: '[Bug]: '
labels: ['bug']
body:
  - type: dropdown
    id: bug-platform
    attributes:
      label: Where did the bug occur?
      options:
        - Web
        - iOS
        - Android
    validations:
      required: true
  - type: textarea
    id: bug-report
    attributes:
      label: What is the bug?
      description: What should happen?
      placeholder:
      value:
    validations:
      required: true
