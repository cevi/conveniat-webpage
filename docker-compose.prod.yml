# The conveniat27 production stack, as deployed.
#
# This is a copy of /cluster/swarm/stacks/conveniat/docker-compose.yml on cevi-tools-s02,
# which ansible copies there from cevi-tools-infrastructure. That repository is where a
# change to the stack is made; this copy exists so the deployment can be read alongside the
# code it runs, and it is only worth having while it matches. It is not runnable as it
# stands: the `configs` below name files on the host, and the volumes name host paths.
#
services:
  payload:
    image: registry.cevi.tools/cevi/conveniat27-webpage:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=BGXpnSSQfJS84zCk6qka6-3qC_bTK6feOUaLz6ZJY6ThmdcY-h20V0QB8P8nq84Pb6vpbZLvYwISwlSmH9aZwjU
        - NEXT_PUBLIC_APP_HOST_URL=https://conveniat27.ch
        - NEXT_PUBLIC_POSTHOG_KEY=phc_QXeG5AHoyxCVCcIse8a2rriQKZgAwkk3vO15Zz0aDud
        - NEXT_PUBLIC_POSTHOG_HOST=https://eu.i.posthog.com

    deploy:
      replicas: 2

      update_config:
        parallelism: 1 # Update one replica at a time
        delay: 15s # No delay between updates
        order: start-first # Start new containers before stopping old ones
        monitor: 5s # Time to wait after an update to monitor for failure
        failure_action: pause # What to do if an update fails
        max_failure_ratio: 0.0 # Fail immediately if any container fails during update

      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s

      labels:
        # Shepherd polls the registry every minute and rolls the service when the tag's digest
        # changes. This is what makes a published release reach the deployment.
        - shepherd.enable=true

      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

    volumes:
      - /cluster/dist_storage_insane/service_data/conveniat-prod/firebase-service-account.json:/app/firebase-service-account.json:ro
      # The image's entrypoint copies each build's .next/static in here, and nginx serves
      # /_next/static/ from the same directory, so a browser still running the previous build
      # can fetch its chunks after the rollover. The container runs as uid 1001, so the host
      # directory must be owned by it: chown -R 1001:65533 <dir>
      - /cluster/dist_storage_insane/service_data/conveniat-prod/next-static-cumulative:/app/.next/static-persistent:rw
      - /cluster/dist_storage_insane/service_data/conveniat-prod/next-cache:/app/.next/cache

    # dns:
    #  - 8.8.8.8 # Replace with your desired DNS server

    depends_on:
      - mongo
    env_file:
      - .env

    # OpenTelemetry wiring for the shared, multi-tenant observability stack.
    # Declared here rather than in .env so the telemetry identity of this
    # deployment is version-controlled. These override any OTEL_* left in .env
    # (compose `environment:` beats `env_file:`).
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://observability_tempo:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://observability_loki:3100/otlp/v1/logs
      # Selects the tenant in Loki and Tempo.
      OTEL_TENANT_ID: conveniat27-prod
      OTEL_SERVICE_NAME: conveniat27-app
      OTEL_SERVICE_NAMESPACE: conveniat27
      DEPLOYMENT_ENV: production
      # Head sampling. Measured at 38 MB/h of compressed blocks per service at
      # 100%; 25% keeps production inside the shared 4 GB Tempo budget.
      OTEL_TRACES_SAMPLER_ARG: '0.25'

    networks:
      - backend-net
      - observability-net

    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:3000/status | grep -q "status\":\"ok"']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    deploy:
      replicas: 2
      labels:
        - swarmpit.service.deployment.autoredeploy=true

        - traefik.enable=true
        - traefik.docker.network=traefik-net-1400

        # redirect conveniat.ch (HTTPS)
        - traefik.http.routers.conveniat-redirect-secure.rule=Host(`conveniat.ch`)
        - traefik.http.routers.conveniat-redirect-secure.entrypoints=websecure
        - traefik.http.routers.conveniat-redirect-secure.middlewares=redirect-to-conveniat27-from-conveniat

        - traefik.http.middlewares.redirect-to-conveniat27-from-conveniat.redirectregex.regex=^https?://conveniat.ch/(.*)
        - traefik.http.middlewares.redirect-to-conveniat27-from-conveniat.redirectregex.replacement=https://conveniat27.ch/$$$${1}
        - traefik.http.middlewares.redirect-to-conveniat27-from-conveniat.redirectregex.permanent=true

        # redirect conveniat.ch (HTTP to HTTPS for redirect)
        - traefik.http.routers.conveniat-redirect-http.rule=Host(`conveniat.ch`)
        - traefik.http.routers.conveniat-redirect-http.entrypoints=web
        - traefik.http.routers.conveniat-redirect-http.middlewares=redirect-to-https@file

        # short url
        # con27.ch is served by the app itself rather than redirected at the edge, so a
        # printed short link costs one hop instead of two: addprefix turns /agbs into
        # /go/agbs and the route handler answers 307 straight to the target. Only the app
        # can do this — the slug to target mapping lives in the `go` collection, which
        # editors change without a deploy. The handler answers with an absolute Location
        # (APP_HOST_URL), which is what keeps the reader from landing back on con27.ch and
        # looping through this same prefix; see fix(go) in conveniat27 v1.11.1.
        - traefik.http.routers.short-con27-router.rule=Host(`con27.ch`)
        - traefik.http.routers.short-con27-router.entrypoints=websecure
        - traefik.http.routers.short-con27-router.service=conveniat27
        - traefik.http.routers.short-con27-router.middlewares=con27-go-prefix,retry-middleware-prod
        - traefik.http.routers.short-con27-router.priority=1
        - traefik.http.middlewares.con27-go-prefix.addprefix.prefix=/go

        # Universal Links (iOS) and App Links (Android) fetch AASA / assetlinks.json
        # straight from con27.ch's own root, expecting a direct 200 — not a redirect
        # through the /go short-link prefix. This bypasses con27-go-prefix so those
        # two files are served exactly like on conveniat27.ch.
        - traefik.http.routers.con27-wellknown-router.rule=Host(`con27.ch`) && PathPrefix(`/.well-known/`)
        - traefik.http.routers.con27-wellknown-router.entrypoints=websecure
        - traefik.http.routers.con27-wellknown-router.service=conveniat27
        - traefik.http.routers.con27-wellknown-router.middlewares=retry-middleware-prod
        - traefik.http.routers.con27-wellknown-router.priority=100

        - traefik.http.routers.con27-router-http.rule=Host(`con27.ch`)
        - traefik.http.routers.con27-router-http.entrypoints=web
        - traefik.http.routers.con27-router-http.middlewares=redirect-to-https@file

        # HTTP gets redirected to HTTPS
        - traefik.http.routers.conveniat27-router-http.rule=Host(`conveniat27.ch`) || Host(`www.conveniat27.ch`)
        - traefik.http.routers.conveniat27-router-http.entrypoints=web
        - traefik.http.routers.conveniat27-router-http.middlewares=redirect-to-https@file

        - traefik.http.routers.conveniat27-router.rule=Host(`conveniat27.ch`) || Host(`www.conveniat27.ch`)
        - traefik.http.routers.conveniat27-router.entrypoints=websecure
        - traefik.http.routers.conveniat27-router.service=conveniat27
        - traefik.http.routers.conveniat27-router.middlewares=conveniat27-to-non-www,retry-middleware-prod

        - traefik.http.services.conveniat27.loadbalancer.server.port=80

        - traefik.http.middlewares.conveniat27-to-non-www.redirectregex.regex=^https://www.conveniat27.ch/(.*)
        - traefik.http.middlewares.conveniat27-to-non-www.redirectregex.replacement=https://conveniat27.ch/$$$${1}
        - traefik.http.middlewares.conveniat27-to-non-www.redirectregex.permanent=true

        # Add Traefik healthcheck labels
        - traefik.http.services.conveniat27.loadbalancer.healthcheck.path=/status
        - traefik.http.services.conveniat27.loadbalancer.healthcheck.interval=5s
        - traefik.http.services.conveniat27.loadbalancer.healthcheck.timeout=3s

        # Define a middleware for retrying failed requests.
        - traefik.http.middlewares.retry-middleware-prod.retry.attempts=3
        - traefik.http.middlewares.retry-middleware-prod.retry.initialinterval=50ms

    configs:
      - source: nginx-config
        target: /etc/nginx/nginx.conf
    volumes:
      - /cluster/dist_storage_insane/service_data/conveniat-prod/nginx-cache:/var/cache/nginx
      - /cluster/dist_storage_insane/service_data/conveniat-prod/next-static-cumulative:/var/www/next-static:ro
    networks:
      - backend-net
      - traefik-net-1400
    depends_on:
      - payload

  mongo:
    image: mongo:latest
    command:
      - --storageEngine=wiredTiger
    volumes:
      - /cluster/dist_storage_insane/service_data/conveniat-prod/mongodb-data:/data/db
    logging:
      driver: none

    networks:
      - backend-net

  mongo-backup:
    image: mongo:latest
    depends_on:
      - mongo
    networks:
      - backend-net
    volumes:
      - /cluster/dist_storage_insane/service_data/conveniat-prod/mongodb-data-backup-dumps:/backup
    # Hourly dumps of a 522M database. The previous form wrote an uncompressed
    # directory tree (`--out`), so 30 days of retention meant 743 near-identical
    # copies: 53 GB across 91,615 files, of which _generic-page_versions.bson
    # alone was 41 MB of every 74 MB dump. `--archive --gzip` makes each backup a
    # single ~12 MB file, taking the store to roughly 9 GB and 743 files, and
    # turns the retention sweep into a flat unlink instead of a tree walk.
    #
    # The old sweep also lacked -maxdepth 1, so it descended into every dump and
    # matched the inner per-database directories as deletion candidates too. Both
    # patterns are kept for now so the existing directory-format dumps still age
    # out; the -type d branch can go once the last of them is past 30 days.
    command: >
      sh -c '
        while true; do
          echo "INFO: 🧹 Deleting backups older than 30 days...";
          find /backup -maxdepth 1 -type f -name "dump_*.gz" -mtime +30 -delete;
          find /backup -maxdepth 1 -type d -name "dump_*" -mtime +30 -exec rm -rf {} +;
          echo "INFO: Creating database backup...";
          mongodump --host mongo --gzip --archive=/backup/dump_$$$$(date +%Y-%m-%d_%H-%M-%S).gz;
          echo "INFO: Backup complete. Waiting 1 hour.";
          sleep 3600; # 1 hour
        done
      '

    # The service previously ran with no resource limits at all.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # S3 storage for Payload uploads. All components run in one process; the entrypoint config
  # builds the S3 identities from the S3_* variables, so the app configuration is the same as
  # it was with MinIO.
  seaweedfs:
    image: chrislusf/seaweedfs:4.46

    entrypoint: ['/docker-entrypoint.sh']

    env_file:
      - .env

    environment:
      # Space separated list of buckets created on start.
      SEAWEEDFS_BUCKETS: conveniat-files conveniat-bill-pdfs

    configs:
      - source: seaweedfs-entrypoint
        target: /docker-entrypoint.sh
        mode: 0755

    volumes:
      - /cluster/dist_storage_insane/service_data/conveniat-prod/seaweedfs-data:/data

    deploy:
      labels:
        - traefik.enable=true
        # The service sits on three networks, so traefik has to be told which one to dial.
        - traefik.docker.network=traefik-net-1400

        - traefik.http.routers.conveniat-seaweedfs-router-http.rule=Host(`s3.conveniat27.ch`)
        - traefik.http.routers.conveniat-seaweedfs-router-http.entrypoints=web
        - traefik.http.routers.conveniat-seaweedfs-router-http.middlewares=redirect-to-https@file

        - traefik.http.routers.conveniat-seaweedfs-router.rule=Host(`s3.conveniat27.ch`)
        - traefik.http.routers.conveniat-seaweedfs-router.entrypoints=websecure
        - traefik.http.routers.conveniat-seaweedfs-router.service=conveniat-seaweedfs

        - traefik.http.services.conveniat-seaweedfs.loadbalancer.server.port=9000

    networks:
      - traefik-net-1400
      - backend-net

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://127.0.0.1:9333/cluster/status >/dev/null && curl -s -o /dev/null http://127.0.0.1:9000/',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17

    deploy:
      labels:
        - swarmpit.service.deployment.autoredeploy=true

        # expose the DB via tcp on port 443
        - traefik.enable=true
        - traefik.tcp.routers.conveniat27-database.entrypoints=websecure
        - traefik.tcp.routers.conveniat27-database.rule=HostSNI(`db.conveniat27.ch`)

        # define TLS
        - traefik.tcp.routers.conveniat27-database.tls=true
        - traefik.tcp.routers.conveniat27-database.tls.certresolver=myresolver
        - traefik.tcp.routers.conveniat27-database.middlewares=vpn-whitelist@file

        - traefik.tcp.services.conveniat27-database.loadbalancer.server.port=5432

    env_file:
      - .env

    volumes:
      - /cluster/dist_storage_insane/service_data/conveniat-prod/postgres:/var/lib/postgresql/data

    networks:
      - backend-net
      - traefik-net-1400

  # tempo / loki removed — telemetry now goes to the shared, multi-tenant
  # stack in stacks/observability under the `conveniat27-prod` tenant,
  # reached over the external observability-net.

  redis:
    image: redis:alpine
    networks:
      backend-net:
        aliases:
          - redis
    volumes:
      - /cluster/dist_storage_insane/service_data/conveniat-prod/redis:/data
#    logging:
#      driver: none

configs:
  seaweedfs-entrypoint:
    name: seaweedfs_entrypoint_conveniat_prod-${STAMP}
    file: /cluster/dist_storage_insane/config/conveniat27/seaweedfs-entrypoint.sh

  nginx-config:
    name: nginx_conveniat_prod-${STAMP}
    file: /cluster/dist_storage_insane/config/conveniat27/nginx.conf

networks:
  traefik-net-1400:
    external: true

  backend-net:
    driver: overlay
    attachable: true

  observability-net:
    external: true
    attachable: true
